[workspace]
resolver = "3"
members = ["scene", "render", "tools", "ui"]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "AGPL-3.0-only"
repository = "https://github.com/fakmalpradana/wangungis"

# Hew core crates (ADR-000 option A2), pinned to one commit: v1.3.1.
# Changing this rev needs human approval (AGENTS.md §14).
[workspace.dependencies]
wangungis-scene = { path = "scene" }
wangungis-render = { path = "render" }
wangungis-tools = { path = "tools" }
kernel = { git = "https://github.com/hew3d/hew", rev = "612c1c15e68f7d9ce3763dca17079f5263dc6137" }
tessellate = { git = "https://github.com/hew3d/hew", rev = "612c1c15e68f7d9ce3763dca17079f5263dc6137" }
inference = { git = "https://github.com/hew3d/hew", rev = "612c1c15e68f7d9ce3763dca17079f5263dc6137" }
wgpu = "30"
eframe = { version = "0.37", default-features = false, features = ["wgpu", "default_fonts", "wayland", "x11"] }
bytemuck = { version = "1", features = ["derive"] }
pollster = "1"
proptest = "1"
# Already in the tree through `kernel`, with the same features (ADR-006).
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
zip = { version = "9", default-features = false }
